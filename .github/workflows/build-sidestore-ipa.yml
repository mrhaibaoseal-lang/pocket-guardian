name: Build Unsigned SideStore IPA (iPhone 16 Plus / iOS 27)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS Runner image (use macos-26-intel when arm64 pool is congested)"
        required: false
        default: "macos-26-intel"
  push:
    branches:
      - main
      - master

jobs:
  build-unsigned-ipa:
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prebuild native iOS project (iOS 17.0+ compatible with iOS 27)
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Inject Swift AppIntents & WidgetKit Extension into Xcode Project
        run: |
          APP_DIR=$(find ios -maxdepth 1 -type d ! -name "ios" ! -name "Pods" ! -name "build" ! -name "*.xcodeproj" ! -name "*.xcworkspace" | head -n 1)
          cp targets/app-intents/PocketGuardianShortcuts.swift "ios/PocketGuardianShortcuts.swift"
          cp targets/app-intents/PocketGuardianShortcuts.swift "$APP_DIR/PocketGuardianShortcuts.swift"

          cat << 'EOF' > "$APP_DIR/PocketWidgetBridge.m"
          #import <UIKit/UIKit.h>

          @interface PocketWidgetReloader : NSObject
          + (void)reloadAllWithDelay;
          @end

          @interface PocketWidgetBridge : NSObject
          @end

          @implementation PocketWidgetBridge
          + (void)load {
            [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationWillResignActiveNotification
                                                              object:nil
                                                               queue:[NSOperationQueue mainQueue]
                                                          usingBlock:^(__unused NSNotification *note) {
              [PocketWidgetReloader reloadAllWithDelay];
            }];
            [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidEnterBackgroundNotification
                                                              object:nil
                                                               queue:[NSOperationQueue mainQueue]
                                                          usingBlock:^(__unused NSNotification *note) {
              [PocketWidgetReloader reloadAllWithDelay];
            }];
          }
          @end
          EOF
          cp "$APP_DIR/PocketWidgetBridge.m" "ios/PocketWidgetBridge.m"

          mkdir -p ios/PocketGuardianWidgetExtension
          cp targets/widget/PocketGuardianWidget.swift ios/PocketGuardianWidgetExtension/PocketGuardianWidget.swift
          cat << 'EOF' > ios/PocketGuardianWidgetExtension/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>$(DEVELOPMENT_LANGUAGE)</string>
            <key>CFBundleDisplayName</key>
            <string>靠北我錢呢</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
            <key>CFBundleShortVersionString</key>
            <string>3.3.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>NSExtension</key>
            <dict>
              <key>NSExtensionPointIdentifier</key>
              <string>com.apple.widgetkit-extension</string>
            </dict>
          </dict>
          </plist>
          EOF

          ruby -e '
            require "xcodeproj"
            proj_path = Dir.glob("ios/*.xcodeproj").first
            project = Xcodeproj::Project.open(proj_path)
            target = project.targets.first
            app_name = File.basename(proj_path, ".xcodeproj")
            group = project.main_group.find_subpath(app_name, true)

            shortcuts_ref = group.new_file("PocketGuardianShortcuts.swift")
            bridge_ref = group.new_file("PocketWidgetBridge.m")
            target.add_file_references([shortcuts_ref, bridge_ref])

            widget_target = project.new_target(:app_extension, "PocketGuardianWidgetExtension", :ios, "17.0")
            widget_swift_ref = project.main_group.new_file("PocketGuardianWidgetExtension/PocketGuardianWidget.swift")
            widget_target.add_file_references([widget_swift_ref])

            widget_target.build_configurations.each do |config|
              config.build_settings["PRODUCT_NAME"] = "PocketGuardianWidgetExtension"
              config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "com.mrhaibaoseal.pocketguardian.widget"
              config.build_settings["INFOPLIST_FILE"] = "PocketGuardianWidgetExtension/Info.plist"
              config.build_settings["GENERATE_INFOPLIST_FILE"] = "NO"
              config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "17.0"
              config.build_settings["SWIFT_VERSION"] = "5.0"
              config.build_settings["TARGETED_DEVICE_FAMILY"] = "1"
              config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              config.build_settings["CODE_SIGN_IDENTITY"] = ""
              config.build_settings["SKIP_INSTALL"] = "YES"
              config.build_settings["MARKETING_VERSION"] = "3.3.0"
              config.build_settings["CURRENT_PROJECT_VERSION"] = "1"
              config.build_settings["LD_RUNPATH_SEARCH_PATHS"] = "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
              config.build_settings["CLANG_ENABLE_MODULES"] = "YES"
            end

            target.add_dependency(widget_target)
            embed_phase = target.new_copy_files_build_phase("Embed App Extensions")
            embed_phase.symbol_dst_subfolder_spec = :plug_ins
            build_file = embed_phase.add_file_reference(widget_target.product_reference)
            build_file.settings = { "ATTRIBUTES" => ["RemoveHeadersOnCopy"] }

            project.save
            puts "Injected Shortcuts, Bridge, and WidgetExtension into #{target.name}"
          '

      - name: Build unsigned .app (Bypassing Xcode code signing for SideStore)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
             clean build

      - name: Package Payload into PocketGuardian-SideStore.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          APPEX_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.appex" -maxdepth 1 | head -n 1)
          if [ -n "$APPEX_PATH" ] && [ ! -d "$APP_PATH/PlugIns/PocketGuardianWidgetExtension.appex" ]; then
            mkdir -p "$APP_PATH/PlugIns"
            cp -R "$APPEX_PATH" "$APP_PATH/PlugIns/"
          fi
          ls -la "$APP_PATH/PlugIns" || true
          cp -R "$APP_PATH" Payload/
          zip -r9 PocketGuardian-SideStore.ipa Payload

      - name: Upload SideStore Unsigned IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PocketGuardian-SideStore-IPA
          path: PocketGuardian-SideStore.ipa
